<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Would You Rather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-shell">
        <p class="eyebrow">The great debate</p>
        <h1>Would You Rather?</h1>

        <section id="gameScreen" class="game-screen" aria-live="polite">
            <div class="progress-row">
                <span id="questionCounter">Question 1 of 12</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-track" aria-hidden="true">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <h2 id="questionPrompt">Pick your side.</h2>
            <div class="options">
                <button id="optionA" class="option option-a" type="button">
                    <span class="option-label">A</span>
                    <span id="optionAText">Option A</span>
                </button>
                <button id="optionB" class="option option-b" type="button">
                    <span class="option-label">B</span>
                    <span id="optionBText">Option B</span>
                </button>
            </div>
        </section>

        <section id="resultsScreen" class="results-screen" hidden aria-live="polite">
            <p class="eyebrow">Final verdict</p>
            <h2>You made it through all the debates.</h2>
            <p id="resultsSummary"></p>
            <button id="restartButton" class="restart-button" type="button">Play again</button>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
